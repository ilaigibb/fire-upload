name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Package release
        run: |
          mkdir release
          cp dist/server.js release/
          cp deploy/install.sh release/
          cp deploy/update.sh release/
          cp deploy/file-upload.service release/
          cp deploy/file-upload-update.service release/
          cp deploy/file-upload-update.timer release/
          cp deploy/duckdns-update.sh release/
          cp deploy/duckdns-update.service release/
          cp deploy/duckdns-update.timer release/
          cp deploy/proxmox.sh install-file-upload.sh
          printf '%s\n' "$GITHUB_REF_NAME" > release/VERSION
          tar -C release -czf file-upload.tar.gz .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" file-upload.tar.gz install-file-upload.sh --generate-notes --verify-tag
